<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Schedule Adjuster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sleep Schedule Adjuster</h1>
        <form id="schedule-form">
            <label for="current-wake-up-time">Current Wake-Up Time:</label>
            <input type="text" id="current-wake-up-time" placeholder="e.g., 8:00 AM" required>
            <br>
            <label for="desired-wake-up-time">Desired Wake-Up Time:</label>
            <input type="text" id="desired-wake-up-time" placeholder="e.g., 6:00 AM" required>
            <br>
            <button type="button" id="calculate">Calculate Schedule</button>
        </form>

        <h2>Your 7-Day Schedule</h2>
        <table id="schedule-table" border="1">
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Wake-Up Time</th>
                    <th>Bedtime</th>
                </tr>
            </thead>
            <tbody>
                <!-- Schedule rows will be dynamically added here -->
            </tbody>
        </table>
    </div>
    <script src="index.js"></script>
</body>
</html>
